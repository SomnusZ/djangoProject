// =============================================================================
// user_playtask_relation.proto  —  用户玩法任务关联模块的 Protobuf 消息定义
//
// 接口覆盖：
//   POST /api/user-playtask/bindPlaytaskToUser/      （绑定玩法任务到用户）
//   POST /api/user-playtask/unbindPlaytaskFromUser/  （解绑玩法任务与用户）
//   GET  /api/user-playtask/dirPlaytaskListByUser/   （查询用户名下玩法任务列表）
//
// 编译方式（生成 user_playtask_relation_pb2.py）：
//   venv/Scripts/python.exe -m grpc_tools.protoc \
//     -I. \
//     -Ivenv/Lib/site-packages/grpc_tools/_proto \
//     --python_out=. \
//     app/proto/user_playtask_relation.proto
// =============================================================================

syntax = "proto3";

package aipet;

// 引入公共类型：ValidationError（字段级校验错误）
import "app/proto/common.proto";

// =============================================================================
// 共享数据结构
// =============================================================================

// PlaytaskRelationInfo —— 用户玩法任务关联记录信息。
// 在绑定成功和列表查询中均返回此结构。
message PlaytaskRelationInfo {
  int32  relation_id       = 1; // 关联记录主键，数据库自增 ID
  int32  user_id           = 2; // 关联的用户 ID
  int32  playtask_id       = 3; // 关联的玩法任务 ID
  string playtask_name     = 4; // 玩法任务名称，冗余字段，方便客户端直接展示
  int32  playtask_progress = 5; // 当前用户该任务的完成进度，默认 0
}

// PlaytaskUnbindInfo —— 解绑成功后返回的确认信息（无 relation_id，因记录已删除）。
message PlaytaskUnbindInfo {
  int32 playtask_id = 1; // 被解绑的玩法任务 ID
}

// =============================================================================
// 响应消息
// =============================================================================

// BindPlaytaskResponse —— 绑定玩法任务到用户的响应格式。
// 对应接口：POST /api/user-playtask/bindPlaytaskToUser/
message BindPlaytaskResponse {
  string              result  = 1; // "success" 或 "fail"
  bool                success = 2; // true / false
  PlaytaskRelationInfo data   = 3; // 绑定成功时返回的关联记录；失败时字段均为默认值

  oneof message_content {
    string          text  = 4; // 例："绑定成功"、"该用户已绑定该玩法任务"
    ValidationError error = 5; // 字段级校验错误
  }
}

// UnbindPlaytaskResponse —— 解绑玩法任务与用户的响应格式。
// 对应接口：POST /api/user-playtask/unbindPlaytaskFromUser/
message UnbindPlaytaskResponse {
  string             result  = 1; // "success" 或 "fail"
  bool               success = 2; // true / false
  PlaytaskUnbindInfo data    = 3; // 解绑成功时返回确认信息；失败时字段均为默认值

  oneof message_content {
    string          text  = 4; // 例："解绑成功"、"关联不存在"
    ValidationError error = 5; // 字段级校验错误
  }
}

// PlaytaskRelationListResponse —— 查询用户玩法任务列表的响应格式。
// 对应接口：GET /api/user-playtask/dirPlaytaskListByUser/
// data 为 repeated，可包含 0 到多条关联记录。
message PlaytaskRelationListResponse {
  string                      result  = 1; // "success" 或 "fail"
  bool                        success = 2; // true / false
  repeated PlaytaskRelationInfo data  = 3; // 玩法任务关联列表，可为空列表

  oneof message_content {
    string          text  = 4; // 例："查询成功"
    ValidationError error = 5; // 保留以保持结构一致性
  }
}

// =============================================================================
// 请求消息
// =============================================================================

// BindPlaytaskRequest —— 绑定玩法任务到用户的请求体。
// 对应接口：POST /api/user-playtask/bindPlaytaskToUser/
message BindPlaytaskRequest {
  int32 playtask_id = 1; // 要绑定的玩法任务 ID，必须已存在
}

// UnbindPlaytaskRequest —— 解绑玩法任务与用户的请求体。
// 对应接口：POST /api/user-playtask/unbindPlaytaskFromUser/
message UnbindPlaytaskRequest {
  int32 playtask_id = 1; // 要解绑的玩法任务 ID
}

// GET dirPlaytaskListByUser 无需请求体，用户身份从 JWT 中自动获取。
