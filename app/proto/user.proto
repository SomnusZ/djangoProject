// =============================================================================
// user.proto  —  用户模块的 Protobuf 消息定义
//
// 作用：
//   为用户模块（app/user）的所有 HTTP 请求和响应定义强类型消息结构，
//   替代原来 JSON 中字段类型不明确的问题，让序列化/反序列化更安全。
//
// 编译方式（生成 user_pb2.py）：
//   venv/Scripts/python.exe -m grpc_tools.protoc \
//     -I. \
//     -Ivenv/Lib/site-packages/grpc_tools/_proto \
//     --python_out=. \
//     app/proto/user.proto
//
// 依赖：
//   google/protobuf/struct.proto  —  提供动态类型 Value / ListValue，
//   用于 ValidationError 中存储任意数量的字符串列表。
// =============================================================================

syntax = "proto3";

// 包名：所有生成类归入 aipet 命名空间，避免与其他项目消息冲突。
package aipet;

// ValidationError 已移至 common.proto，此处引入以便在 oneof message_content 中使用。
import "app/proto/common.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// 公共数据结构（Shared types）
// 这些消息被多个请求/响应消息复用，统一放在文件顶部方便查阅。
// =============================================================================

// UserInfo —— 用户基础信息 DTO（Data Transfer Object）。
// 在注册、登录、查询、更新等响应中均返回此结构，
// 不含 user_password（密码不向客户端暴露）。
message UserInfo {
  int32  user_id               = 1; // 用户主键，数据库自增 ID
  string user_name             = 2; // 用户昵称，注册时自动生成，可通过 updateUser 修改
  string user_profile_picture  = 3; // 头像 URL；未设置时为空字符串
  string user_phone_number     = 4; // 手机号，唯一，用作登录凭证
  string user_mail_address     = 5; // 邮箱；字段保留但当前版本未启用
  int32  user_status           = 6; // 用户状态整型值，含义由字典项配置（如 0=正常 1=禁用 2=注销）
  int32  user_role             = 7; // 用户角色（0=普通用户 1=管理员）
}

// TokenPair —— 登录成功后签发的 JWT 令牌对。
//   access_token  : 短期令牌，用于访问受保护接口，Header 携带方式：
//                   Authorization: Bearer <access_token>
//   refresh_token : 长期令牌，用于换取新的 access_token，
//                   调用 POST /api/auth/token/refresh/
message TokenPair {
  string access_token  = 1;
  string refresh_token = 2;
}

// LoginData —— 登录响应的 data 字段内容，包含用户信息与令牌对。
// 对应 JSON 结构：
//   { "user": {...}, "token": {"access_token": "...", "refresh_token": "..."} }
message LoginData {
  UserInfo  user  = 1;
  TokenPair token = 2;
}

// ValidationError 已在 common.proto 中定义，此处直接使用，无需重复定义。

// =============================================================================
// 响应消息（Response messages）
//
// 设计说明：message_content oneof
//   旧版本中 message 字段使用 google.protobuf.Value（动态类型），
//   虽然灵活但失去了类型约束，客户端无法静态推断 message 的具体类型。
//
//   新版本改为 oneof message_content，明确区分两种情况：
//     text  —— 纯文本消息（如"注册成功"、"密码错误"等单行说明）
//     error —— 字段级结构化校验错误（如手机号格式不对、密码长度不足）
//
//   客户端可通过 message_content 的 case 判断当前返回的是哪种类型，
//   从而分别渲染提示文案或表单字段下方的错误信息。
// =============================================================================

// UserResponse —— 用户注册 / 信息修改 / 信息查询接口的统一响应格式。
// 对应接口：
//   POST /api/users/createUser/   （注册）
//   PUT  /api/users/updateUser/   （修改用户名）
//   GET  /api/users/dirUser/      （查询用户信息）
message UserResponse {
  string   result  = 1; // "success" 或 "fail"
  bool     success = 2; // true / false，与 result 冗余，方便客户端直接 if-check
  UserInfo data    = 3; // 操作成功时返回的用户信息；失败时字段均为默认值（空/0）

  // message_content：响应说明，同一条消息只会设置其中一个分支。
  oneof message_content {
    string          text  = 4; // 纯文本说明，例："注册成功"、"用户不存在"
    ValidationError error = 5; // 字段级校验错误，例：{"user_phone_number": ["手机号已存在"]}
  }
}

// UserLoginResponse —— 用户登录接口的响应格式。
// 对应接口：POST /api/users/dirUser/（login_type=password 或 login_type=code）
// data 包含 UserInfo + TokenPair，登录失败时 data 字段为默认空值。
message UserLoginResponse {
  string    result  = 1;
  bool      success = 2;
  LoginData data    = 3; // 登录成功时包含用户信息与 JWT 令牌对

  oneof message_content {
    string          text  = 4; // 例："登录成功"、"密码错误"、"用户不存在"
    ValidationError error = 5; // 例：{"user_phone_number": ["该字段是必填项"]}
  }
}

// =============================================================================
// 请求消息（Request messages）
//
// 客户端发送 Content-Type: application/x-protobuf 时，请求体为以下消息的二进制序列化。
// 服务端 ProtobufParser 会将其反序列化为 Python dict，
// 再交给对应的 DRF Serializer 进行字段校验，视图层无需感知格式变化。
//
// GET 请求（如查询接口）参数通过 URL Query String 传递，不使用请求体消息。
// =============================================================================

// CreateUserRequest —— 用户注册请求体。
// 对应接口：POST /api/users/createUser/
// 所有字段均为必填（由 DRF CreateUserSerializer 负责校验）。
message CreateUserRequest {
  string user_phone_number    = 1; // 中国大陆 11 位手机号，全局唯一
  string user_password        = 2; // 登录密码，至少 6 位
  string user_password_confirm = 3; // 密码确认，必须与 user_password 一致
  string user_phone_code      = 4; // 手机验证码（当前为占位字段，暂不做真实校验）
}

// LoginRequest —— 用户登录请求体。
// 对应接口：POST /api/users/dirUser/
// login_type 决定走哪个登录分支：
//   "password" —— 手机号 + 密码登录，需传 user_password
//   "code"     —— 手机号 + 验证码登录，需传 user_phone_code
message LoginRequest {
  string user_phone_number = 1; // 登录手机号
  string login_type        = 2; // 登录方式："password" 或 "code"
  string user_password     = 3; // login_type=password 时必填；否则可留空
  string user_phone_code   = 4; // login_type=code 时必填；否则可留空
}

// UpdateUserRequest —— 修改用户信息请求体。
// 对应接口：PUT /api/users/updateUser/
// 当前版本只允许修改 user_name，其余字段（手机号、密码）通过专用接口修改。
message UpdateUserRequest {
  string user_name = 1; // 新昵称，不可为空
}
