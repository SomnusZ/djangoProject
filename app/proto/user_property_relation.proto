// =============================================================================
// user_property_relation.proto  —  用户属性关联模块的 Protobuf 消息定义
//
// 接口覆盖：
//   POST /api/user-property/bindPropertyToUser/      （绑定属性到用户）
//   POST /api/user-property/unbindPropertyFromUser/  （解绑属性与用户）
//   GET  /api/user-property/dirPropertyListByUser/   （查询用户名下属性列表）
//
// 编译方式（生成 user_property_relation_pb2.py）：
//   venv/Scripts/python.exe -m grpc_tools.protoc \
//     -I. \
//     -Ivenv/Lib/site-packages/grpc_tools/_proto \
//     --python_out=. \
//     app/proto/user_property_relation.proto
// =============================================================================

syntax = "proto3";

package aipet;

// 引入公共类型：ValidationError（字段级校验错误）
import "app/proto/common.proto";

// =============================================================================
// 共享数据结构
// =============================================================================

// PropertyRelationInfo —— 用户属性关联记录信息。
// 在绑定成功和列表查询中均返回此结构。
message PropertyRelationInfo {
  int32  relation_id      = 1; // 关联记录主键，数据库自增 ID
  int32  user_id          = 2; // 关联的用户 ID
  int32  property_id      = 3; // 关联的属性 ID
  string property_name    = 4; // 属性名称，冗余字段，方便客户端直接展示
  int32  property_amount  = 5; // 当前用户该属性的数值，默认 0
}

// PropertyUnbindInfo —— 解绑成功后返回的确认信息（无 relation_id，因记录已删除）。
message PropertyUnbindInfo {
  int32 property_id = 1; // 被解绑的属性 ID
}

// =============================================================================
// 响应消息
// =============================================================================

// BindPropertyResponse —— 绑定属性到用户的响应格式。
// 对应接口：POST /api/user-property/bindPropertyToUser/
message BindPropertyResponse {
  string              result  = 1; // "success" 或 "fail"
  bool                success = 2; // true / false
  PropertyRelationInfo data   = 3; // 绑定成功时返回的关联记录；失败时字段均为默认值

  oneof message_content {
    string          text  = 4; // 例："绑定成功"、"该用户已绑定该属性"
    ValidationError error = 5; // 字段级校验错误
  }
}

// UnbindPropertyResponse —— 解绑属性与用户的响应格式。
// 对应接口：POST /api/user-property/unbindPropertyFromUser/
message UnbindPropertyResponse {
  string            result  = 1; // "success" 或 "fail"
  bool              success = 2; // true / false
  PropertyUnbindInfo data   = 3; // 解绑成功时返回确认信息；失败时字段均为默认值

  oneof message_content {
    string          text  = 4; // 例："解绑成功"、"关联不存在"
    ValidationError error = 5; // 字段级校验错误
  }
}

// PropertyRelationListResponse —— 查询用户属性列表的响应格式。
// 对应接口：GET /api/user-property/dirPropertyListByUser/
// data 为 repeated，可包含 0 到多条关联记录。
message PropertyRelationListResponse {
  string                      result  = 1; // "success" 或 "fail"
  bool                        success = 2; // true / false
  repeated PropertyRelationInfo data  = 3; // 属性关联列表，可为空列表

  oneof message_content {
    string          text  = 4; // 例："查询成功"
    ValidationError error = 5; // 保留以保持结构一致性
  }
}

// =============================================================================
// 请求消息
// =============================================================================

// BindPropertyRequest —— 绑定属性到用户的请求体。
// 对应接口：POST /api/user-property/bindPropertyToUser/
message BindPropertyRequest {
  int32 property_id = 1; // 要绑定的属性 ID，必须已存在
}

// UnbindPropertyRequest —— 解绑属性与用户的请求体。
// 对应接口：POST /api/user-property/unbindPropertyFromUser/
message UnbindPropertyRequest {
  int32 property_id = 1; // 要解绑的属性 ID
}

// GET dirPropertyListByUser 无需请求体，用户身份从 JWT 中自动获取。
