// =============================================================================
// playtask.proto  —  玩法任务模块的 Protobuf 消息定义
//
// 接口覆盖：
//   POST /api/playtask/createPlaytask/   （创建玩法任务）
//   PUT  /api/playtask/updatePlaytask/   （修改玩法任务名称）
//   GET  /api/playtask/dirPlaytask/      （查询玩法任务信息）
//
// 编译方式（生成 playtask_pb2.py）：
//   venv/Scripts/python.exe -m grpc_tools.protoc \
//     -I. \
//     -Ivenv/Lib/site-packages/grpc_tools/_proto \
//     --python_out=. \
//     app/proto/playtask.proto
// =============================================================================

syntax = "proto3";

package aipet;

// 引入公共类型：ValidationError（字段级校验错误）
import "app/proto/common.proto";

// =============================================================================
// 共享数据结构
// =============================================================================

// PlaytaskInfo —— 玩法任务基础信息。
// 在创建、修改和查询响应中均返回此结构。
message PlaytaskInfo {
  int32  playtask_id   = 1; // 玩法任务主键，数据库自增 ID
  string playtask_name = 2; // 玩法任务名称，如"每日签到"、"打卡任务"，全局唯一
}

// =============================================================================
// 响应消息
// =============================================================================

// PlaytaskResponse —— 创建 / 修改 / 查询玩法任务接口的统一响应格式。
message PlaytaskResponse {
  string       result  = 1; // "success" 或 "fail"
  bool         success = 2; // true / false
  PlaytaskInfo data    = 3; // 操作成功时返回的玩法任务信息；失败时字段均为默认值

  oneof message_content {
    string          text  = 4; // 纯文本说明，例："创建成功"、"玩法任务不存在"
    ValidationError error = 5; // 字段级校验错误，例：{"playtask_name": ["该玩法任务名称已存在"]}
  }
}

// =============================================================================
// 请求消息
// =============================================================================

// CreatePlaytaskRequest —— 创建玩法任务请求体。
// 对应接口：POST /api/playtask/createPlaytask/
message CreatePlaytaskRequest {
  string playtask_name = 1; // 玩法任务名称，必填，全局唯一
}

// UpdatePlaytaskRequest —— 修改玩法任务请求体。
// 对应接口：PUT /api/playtask/updatePlaytask/
message UpdatePlaytaskRequest {
  int32  playtask_id   = 1; // 要修改的玩法任务 ID，必填，用于定位记录
  string playtask_name = 2; // 新名称，必填
}

// GET dirPlaytask 通过 URL Query String 传参（?playtask_id=1），无请求体消息。
