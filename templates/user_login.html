<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User 登录测试</title>
  <style>
    body { font-family: "Microsoft YaHei", Arial, sans-serif; padding: 24px; }
    form { max-width: 520px; display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 14px; }
    input { padding: 8px 10px; font-size: 14px; }
    button { padding: 10px 12px; font-size: 14px; cursor: pointer; }
    pre { background: #f6f8fa; padding: 12px; white-space: pre-wrap; }
    .tip { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>用户登录接口测试</h1>
  <p>接口：POST /api/users/dirUser/</p>

  <form id="form">
    <label>
      邮箱
      <input type="email" name="user_mail_address" required />
    </label>
    <label>
      密码
      <input type="password" name="user_password" required />
    </label>
    <button type="submit">登录</button>
    <div class="tip">登录成功后会自动保存 access_token 到浏览器 localStorage</div>
  </form>

  <h2>响应结果</h2>
  <pre id="result">等待提交...</pre>

  <script>
    const form = document.getElementById('form');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      resultEl.textContent = '请求中...';
      try {
        const res = await fetch('/api/users/dirUser/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);

        // 保存 access_token 便于其它测试页面使用
        if (data && data.data && data.data.token && data.data.token.access_token) {
          localStorage.setItem('access_token', data.data.token.access_token);
        }
      } catch (err) {
        resultEl.textContent = '请求失败: ' + err.message;
      }
    });
  </script>
</body>
</html>
