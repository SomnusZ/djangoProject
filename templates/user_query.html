<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User 查询测试</title>
  <style>
    body { font-family: "Microsoft YaHei", Arial, sans-serif; padding: 24px; }
    form { max-width: 520px; display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 14px; }
    input { padding: 8px 10px; font-size: 14px; }
    button { padding: 10px 12px; font-size: 14px; cursor: pointer; }
    pre { background: #f6f8fa; padding: 12px; white-space: pre-wrap; }
    .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    .tip { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>用户信息查询测试</h1>
  <p>接口：GET /api/users/dirUser/</p>

  <form id="form">
    <div class="row">
      <label>
        user_id
        <input type="number" name="user_id" />
      </label>
      <label>
        user_mail_address
        <input type="email" name="user_mail_address" />
      </label>
    </div>
    <label>
      access_token（留空则从 localStorage 读取）
      <input type="text" name="access_token" />
    </label>
    <div class="tip">Authorization: Bearer &lt;token&gt;</div>
    <button type="submit">查询</button>
  </form>

  <h2>响应结果</h2>
  <pre id="result">等待提交...</pre>

  <script>
    const form = document.getElementById('form');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const params = new URLSearchParams();
      const userId = formData.get('user_id');
      const mail = formData.get('user_mail_address');
      if (userId) params.append('user_id', userId);
      if (mail) params.append('user_mail_address', mail);

      let token = formData.get('access_token');
      if (!token) {
        token = localStorage.getItem('access_token') || '';
      }

      resultEl.textContent = '请求中...';
      try {
        const res = await fetch('/api/users/dirUser/?' + params.toString(), {
          method: 'GET',
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = '请求失败: ' + err.message;
      }
    });
  </script>
</body>
</html>
