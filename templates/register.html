<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户注册</title>
  <style>
    :root {
      --bg-1: #f6efe8;
      --bg-2: #e7f0ff;
      --ink: #1e2329;
      --muted: #5b6672;
      --accent: #0b6bcb;
      --accent-2: #ff8a00;
      --card: rgba(255, 255, 255, 0.8);
      --border: rgba(30, 35, 41, 0.12);
      --shadow: 0 20px 50px rgba(10, 30, 60, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(1200px 800px at 10% 10%, #fff7ed 0%, transparent 50%),
                  radial-gradient(900px 700px at 90% 20%, #e0f2ff 0%, transparent 50%),
                  linear-gradient(135deg, var(--bg-1), var(--bg-2));
      font-family: "HarmonyOS Sans SC", "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 16px;
    }

    .shell {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .hero {
      padding: 28px;
      border-radius: 24px;
      background: linear-gradient(140deg, #0b6bcb, #4aa3ff 60%, #9ad7ff);
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: -40% -30% auto auto;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45), transparent 60%);
      transform: rotate(15deg);
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    .hero p {
      margin: 0 0 24px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .hero .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .card {
      padding: 28px;
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: rise 0.7s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    input:focus {
      border-color: rgba(11, 107, 203, 0.6);
      box-shadow: 0 0 0 3px rgba(11, 107, 203, 0.15);
      transform: translateY(-1px);
    }

    .row {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 6px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #4aa3ff);
      color: white;
      box-shadow: 0 12px 24px rgba(11, 107, 203, 0.25);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(11, 107, 203, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(11, 107, 203, 0.3);
      box-shadow: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #0b1220;
      color: #e8eef6;
      font-size: 12px;
      min-height: 80px;
      white-space: pre-wrap;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tip {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 880px) {
      .shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>用户注册 · 快速联调</h1>
      <p>使用邮箱 + 密码完成注册，表单会实时展示接口返回结果，便于快速验证后端接口。</p>
      <div class="chips">
        <span class="chip">RESTful JSON</span>
        <span class="chip">统一响应 success/fail</span>
        <span class="chip">可直接联调</span>
      </div>
    </section>

    <section class="card">
      <form id="registerForm">
        <label>
          邮箱
          <input type="email" name="user_mail_address" placeholder="test@example.com" required />
        </label>
        <label>
          密码（至少6位）
          <input type="password" name="user_password" minlength="6" required />
        </label>
        <div class="row">
          <label>
            用户名
            <input type="text" name="user_name" placeholder="可选" />
          </label>
          <label>
            手机号
            <input type="text" name="user_phone_number" placeholder="可选" />
          </label>
        </div>
        <div class="actions">
          <button type="submit">立即注册</button>
          <button type="button" class="ghost" id="fillDemo">一键填充示例</button>
        </div>
        <div class="tip">接口地址：/api/users/createUser/</div>
      </form>

      <div class="status" id="result">等待提交...</div>
    </section>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const resultEl = document.getElementById('result');
    const fillDemoBtn = document.getElementById('fillDemo');

    fillDemoBtn.addEventListener('click', () => {
      form.user_mail_address.value = 'demo_' + Date.now() + '@example.com';
      form.user_password.value = '123456';
      form.user_name.value = 'DemoUser';
      form.user_phone_number.value = '13800000000';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      resultEl.textContent = '请求中...';
      try {
        const res = await fetch('/api/users/createUser/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          resultEl.textContent = JSON.stringify(data, null, 2);
        } else {
          const text = await res.text();
          resultEl.textContent = text;
        }
      } catch (err) {
        resultEl.textContent = '请求失败: ' + err.message;
      }
    });
  </script>
</body>
</html>
